services:
  postgres:
    image: postgres:16-alpine
    container_name: eventforge-postgres
    environment:
      POSTGRES_DB: eventforge_catalog
      POSTGRES_USER: eventforge
      POSTGRES_PASSWORD: eventforge
    ports:
      - "5433:5432"
    volumes:
      - eventforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventforge -d eventforge_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eventforge_postgres_data:
